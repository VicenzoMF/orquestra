[package]
name = "orquestra-app"
description = "Binário `orq` (como o `code .`): a UI egui e os subcomandos `mcp` e `hook stop`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "orq"

[[bin]]
name = "orq"
path = "src/main.rs"

# Nome completo: só repassa os argumentos para o `orq` ao lado.
[[bin]]
name = "orquestra"
path = "src/bin/orquestra.rs"

[dependencies]
orquestra-core.workspace = true
orquestra-runner.workspace = true
orquestra-browser.workspace = true
orquestra-store.workspace = true
orquestra-mcp.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui.workspace = true
eframe.workspace = true
alacritty_terminal.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
nix = { version = "0.28", default-features = false, features = ["process", "user"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Só para desenvolvimento: ganchos que tiram um screenshot PNG e fecham
# (ver `src/ui/dev.rs`). O binário normal não leva o codificador PNG.
screenshot = ["image/png"]

[lints]
workspace = true
