[package]
name = "orquestra-runner"
description = "Agentes em PTY: spawn, I/O, detecção de status, worktree por agente."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
orquestra-core.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "process", "fs"] }
bytes.workspace = true
tracing.workspace = true
portable-pty.workspace = true
vte.workspace = true
serde_json.workspace = true
directories.workspace = true
# Mesma versão que o portable-pty já usa; só liga os sinais (kill/killpg sem unsafe).
nix = { version = "0.28", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
