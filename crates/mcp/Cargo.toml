[package]
name = "orquestra-mcp"
description = "MCP `orquestra` para orquestradores: gateway no app (socket local) e ponte stdio (`orquestra mcp`, `orquestra hook stop`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
orquestra-core.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net", "io-util", "io-std", "fs"] }
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
alacritty_terminal.workspace = true
rmcp.workspace = true
schemars.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tempfile.workspace = true

[lints]
workspace = true
