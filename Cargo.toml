[workspace]
resolver = "3"
members = ["crates/core", "crates/runner", "crates/browser", "crates/store", "crates/mcp", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Versões centralizadas. Membros usam `dep = { workspace = true, features = [...] }`
# (features são aditivas). Dependência nova durante a Fase 1: declare direto no
# Cargo.toml do próprio crate, não aqui, para não gerar conflito de merge.
[workspace.dependencies]
orquestra-core = { path = "crates/core" }
orquestra-runner = { path = "crates/runner" }
orquestra-browser = { path = "crates/browser" }
orquestra-store = { path = "crates/store" }
orquestra-mcp = { path = "crates/mcp" }

# base
tokio = "1.54"
bytes = "1.12"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.28", features = ["v7", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
directories = "6"
libc = "0.2"

# runner
portable-pty = "0.9"
vte = "0.15"

# browser
chromiumoxide = "0.9.1"
base64 = "0.23"

# mcp
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2"

# store
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.8"
notify-rust = "4.18.2"

# app — glow em vez de wgpu: bem menos RAM, que é critério do MVP
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
alacritty_terminal = { version = "0.26", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

# testes
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependências otimizadas mesmo em debug: egui/alacritty ficam fluidos no dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
